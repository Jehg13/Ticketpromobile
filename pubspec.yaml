name: ticketpromobile

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_lucide: ^1.31.0
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^11.0.0
  file_picker: ^12.1.1
  fl_chart: ^1.2.0
  app_links: ^6.3.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/Logo.jpg
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/user.png